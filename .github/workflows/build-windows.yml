name: Build Windows POS

on:
  workflow_dispatch:
  push:
    branches:
      - codex/khan-baba-pos-final-test-2

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      # Keep the committed native runner intact; regenerating it can discard
      # project-specific startup fixes and diagnostics.
      - name: Verify committed Windows runner
        shell: pwsh
        run: |
          foreach ($required in @(
            "windows/runner/main.cpp",
            "windows/runner/flutter_window.cpp",
            "windows/runner/startup_diagnostics.h",
            "windows/runner/Runner.rc",
            "windows/CMakeLists.txt"
          )) {
            if (-not (Test-Path $required)) {
              throw "Required committed Windows runner file is missing: $required"
            }
          }

      - name: Resolve packages
        run: flutter pub get

      - name: Set CMake compatibility policy
        shell: pwsh
        run: |
          $cmakeFile = "windows/CMakeLists.txt"
          $content = Get-Content $cmakeFile -Raw
          $anchor = 'add_subdirectory(${FLUTTER_MANAGED_DIR})'
          if (-not $content.Contains('set(CMAKE_POLICY_VERSION_MINIMUM 3.5)')) {
            if (-not $content.Contains($anchor)) {
              throw "Could not find Flutter CMake subdirectory anchor."
            }
            $content = $content.Replace($anchor, "set(CMAKE_POLICY_VERSION_MINIMUM 3.5)`r`n$anchor")
            Set-Content -Path $cmakeFile -Value $content -NoNewline
          }

      - name: Build release
        run: flutter build windows --release

      - name: Download official Microsoft Visual C++ runtime
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $runtime = Join-Path $releaseDir "VC_redist.x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vc14/vc_redist.x64.exe" -OutFile $runtime
          if (-not (Test-Path $runtime) -or (Get-Item $runtime).Length -lt 1000000) {
            throw "Microsoft Visual C++ Redistributable download is missing or incomplete."
          }
          $signature = Get-AuthenticodeSignature $runtime
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft") {
            throw "Downloaded Visual C++ installer does not have a valid Microsoft signature."
          }
          Write-Host "Verified Microsoft-signed Visual C++ Redistributable."

      - name: Verify portable runtime files
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $exe = Get-ChildItem $releaseDir -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "Windows POS executable was not found." }
          foreach ($required in @("flutter_windows.dll", "data/flutter_assets")) {
            if (-not (Test-Path (Join-Path $releaseDir $required))) {
              throw "Required portable runtime item is missing: $required"
            }
          }
          $sqliteDll = Get-ChildItem $releaseDir -Filter "sqlite3.dll" -Recurse | Select-Object -First 1
          if (-not $sqliteDll) {
            throw "SQLite native runtime (sqlite3.dll) is missing from the release package."
          }
          Write-Host "Verified executable: $($exe.Name)"
          Write-Host "Verified SQLite runtime: $($sqliteDll.FullName)"

      - name: Prepare portable package
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $exe = Get-ChildItem $releaseDir -Filter *.exe | Select-Object -First 1

          @"
          @echo off
          setlocal
          set "APP_DIR=%~dp0"
          set "APP_EXE=%APP_DIR%$($exe.Name)"
          set "VC_INSTALLER=%APP_DIR%VC_redist.x64.exe"
          if not exist "%APP_EXE%" (
            echo Khan Baba POS executable was not found.
            echo Please extract the complete ZIP again and keep all files together.
            pause
            exit /b 1
          )
          if not exist "%SystemRoot%\System32\vcruntime140_1.dll" (
            if not exist "%VC_INSTALLER%" (
              echo Microsoft Visual C++ Runtime installer is missing.
              echo Please re-download the complete Khan Baba POS ZIP.
              pause
              exit /b 1
            )
            echo Installing the required Microsoft Visual C++ Runtime...
            echo Windows may ask for administrator approval one time.
            powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Process -FilePath '%VC_INSTALLER%' -ArgumentList '/install','/quiet','/norestart' -Verb RunAs -Wait"
            if errorlevel 1 (
              echo Visual C++ Runtime installation was not completed.
              echo Please approve the Windows administrator prompt and try again.
              pause
              exit /b 1
            )
          )
          if not exist "%SystemRoot%\System32\vcruntime140_1.dll" (
            echo Required Visual C++ Runtime is still unavailable.
            echo Restart Windows if the installer requested it, then try again.
            pause
            exit /b 1
          )
          pushd "%APP_DIR%"
          start "" "%APP_EXE%"
          popd
          endlocal
          "@ | Set-Content -Path (Join-Path $releaseDir "Start-Khan-Baba-POS.bat") -Encoding ASCII

          @"
          KHAN BABA GENERAL STORE - WINDOWS PORTABLE POS

          QUICK START
          1. Extract the complete ZIP to a normal folder such as Documents or Desktop.
          2. Double-click Start-Khan-Baba-POS.bat.
          3. Keep all files together in the extracted folder.

          NO INSTALLER / ADMIN RIGHTS
          The POS itself is portable and stores data in your Windows user profile. If the Microsoft Visual C++ Runtime is missing, Start-Khan-Baba-POS.bat installs the official Microsoft runtime and may request one-time administrator approval.
          The database is stored in your Windows user profile, not inside the extracted app folder.

          DATA LOCATION
          %LOCALAPPDATA%\KhanBabaPOS\Data\khan_baba_pos.db
          If Local AppData is unavailable, the app checks the roaming AppData and local user profile paths.
          Updating the app ZIP does not replace the database. Continue to use Backup & Restore regularly.

          STARTUP DIAGNOSTICS
          Native startup stages are recorded in:
          %LOCALAPPDATA%\KhanBabaPOS\Logs\native-startup.log
          Dart/database startup errors are recorded in:
          %LOCALAPPDATA%\KhanBabaPOS\Logs\startup.log
          The app does not need administrator rights. If Windows or office security policy blocks the EXE,
          ask the IT administrator to allow this app rather than running it as Administrator.

          CLOUD SYNC
          Google Drive sync is available from the Cloud Sync screen. Connect the same Google account on Windows and Android. Windows is the master copy; review stock and Khata balance conflicts before approving Android changes. Both devices remain usable offline.

          USB scanner and printer behavior depends on device mode and installed Windows drivers.
          "@ | Set-Content -Path (Join-Path $releaseDir "README-PORTABLE.txt") -Encoding UTF8

          Compress-Archive -Path "$releaseDir/*" -DestinationPath build/khan-baba-pos-windows.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: khan-baba-pos-windows
          path: build/khan-baba-pos-windows.zip
          if-no-files-found: error
          retention-days: 3
