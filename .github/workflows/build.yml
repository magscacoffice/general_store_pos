name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java Development Kit
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Android SDK 36 Platform
        run: |
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Create Android Platform Files & Camera Permissions
        run: |
          flutter create . --platforms=android
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "android.permission.CAMERA" "$MANIFEST_PATH"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="hardware.camera.any" android:required="false"/>' "$MANIFEST_PATH"
            fi
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Force SDK 36 Globally in Project and Pub Cache
        run: |
          # Project aur Pub Cache (jahan flutter_blue_plus save hai) ki saari build.gradle files ko SDK 36 par patch karna
          find . -name "build.gradle" -o -name "build.gradle.kts" | while read file; do
            sed -i 's/compileSdkVersion\s*[0-9]*/compileSdkVersion 36/g' "$file"
            sed -i 's/compileSdk\s*=\s*[0-9]*/compileSdk = 36/g' "$file"
            sed -i 's/targetSdkVersion\s*[0-9]*/targetSdkVersion 36/g' "$file"
            sed -i 's/targetSdk\s*=\s*[0-9]*/targetSdk = 36/g' "$file"
            sed -i 's/minSdkVersion\s*[0-9]*/minSdkVersion 21/g' "$file"
            sed -i 's/minSdk\s*=\s*[0-9]*/minSdk = 21/g' "$file"
          done

          find ~/.pub-cache -name "build.gradle" -o -name "build.gradle.kts" 2>/dev/null | while read file; do
            sed -i 's/compileSdkVersion\s*[0-9]*/compileSdkVersion 36/g' "$file"
            sed -i 's/compileSdk\s*=\s*[0-9]*/compileSdk = 36/g' "$file"
            sed -i 's/targetSdkVersion\s*[0-9]*/targetSdkVersion 36/g' "$file"
            sed -i 's/targetSdk\s*=\s*[0-9]*/targetSdk = 36/g' "$file"
            sed -i 's/minSdkVersion\s*[0-9]*/minSdkVersion 21/g' "$file"
            sed -i 's/minSdk\s*=\s*[0-9]*/minSdk = 21/g' "$file"
          done

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralStoreApp-APK
          path: build/app/outputs/flutter-apk/app-release.apk