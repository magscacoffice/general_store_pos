name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java Development Kit
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Android SDK 36 Platform
        run: |
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Create Android Platform Files & Camera Permissions
        run: |
          flutter create . --platforms=android
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "android.permission.CAMERA" "$MANIFEST_PATH"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="hardware.camera.any" android:required="false"/>' "$MANIFEST_PATH"
            fi
          fi

      - name: Force Subprojects compileSdk to 36 in android/build.gradle
        run: |
          GRADLE_FILE="android/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            echo "" >> "$GRADLE_FILE"
            echo "subprojects {" >> "$GRADLE_FILE"
            echo "    afterEvaluate { project ->" >> "$GRADLE_FILE"
            echo "        if (project.hasProperty('android')) {" >> "$GRADLE_FILE"
            echo "            project.android {" >> "$GRADLE_FILE"
            echo "                if (namespace == null) {" >> "$GRADLE_FILE"
            echo "                    namespace project.group" >> "$GRADLE_FILE"
            echo "                }" >> "$GRADLE_FILE"
            echo "                compileSdkVersion 36" >> "$GRADLE_FILE"
            echo "                targetSdkVersion 36" >> "$GRADLE_FILE"
            echo "            }" >> "$GRADLE_FILE"
            echo "        }" >> "$GRADLE_FILE"
            echo "    }" >> "$GRADLE_FILE"
            echo "}" >> "$GRADLE_FILE"
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralStoreApp-APK
          path: build/app/outputs/flutter-apk/app-release.apk