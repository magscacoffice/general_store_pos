name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java Development Kit
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Platform Files & Add Camera Permission
        run: |
          flutter create . --platforms=android
          
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "android.permission.CAMERA" "$MANIFEST_PATH"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="hardware.camera.any" android:required="false"/>' "$MANIFEST_PATH"
            fi
          fi

      - name: Update compileSdk and minSdkVersion in Gradle
        run: |
          # minSdk کو 21 اور compileSdk / targetSdk کو 34 کرنا تاکہ بلیو ٹوتھ اور سکینر کا ایرر نہ آئے
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion.*/minSdkVersion 21/g' android/app/build.gradle
            sed -i 's/targetSdkVersion.*/targetSdkVersion 34/g' android/app/build.gradle
            sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk =.*/minSdk = 21/g' android/app/build.gradle.kts
            sed -i 's/minSdkVersion =.*/minSdkVersion = 21/g' android/app/build.gradle.kts
            sed -i 's/targetSdk =.*/targetSdk = 34/g' android/app/build.gradle.kts
            sed -i 's/compileSdk =.*/compileSdk = 34/g' android/app/build.gradle.kts
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralStoreApp-APK
          path: build/app/outputs/flutter-apk/app-release.apk