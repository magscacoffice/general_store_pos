name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java Development Kit
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Android SDK 36 Platforms
        run: |
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Explicitly Set SDK Versions to 36 in Gradle Files
        run: |
          # build.gradle ፋይል فکس کرنا
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion.*/minSdkVersion 21/g' android/app/build.gradle
            sed -i 's/targetSdkVersion.*/targetSdkVersion 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' android/app/build.gradle
          fi

          # build.gradle.kts ፋይል فکس کرنا
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk =.*/minSdk = 21/g' android/app/build.gradle.kts
            sed -i 's/minSdkVersion =.*/minSdkVersion = 21/g' android/app/build.gradle.kts
            sed -i 's/targetSdk =.*/targetSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/compileSdk =.*/compileSdk = 36/g' android/app/build.gradle.kts
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralStoreApp-APK
          path: build/app/outputs/flutter-apk/app-release.apk