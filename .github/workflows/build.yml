name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java Development Kit
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Platform Files & Add Camera Permission
        run: |
          flutter create . --platforms=android
          
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "android.permission.CAMERA" "$MANIFEST_PATH"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="hardware.camera.any" android:required="false"/>' "$MANIFEST_PATH"
            fi
          fi

      - name: Install Android SDK 36 Platform
        run: |
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Update Gradle Properties and Build Script for SDK 36
        run: |
          # build.gradle فائل میں تمام جگہ compileSdk اور targetSdk 36 بنانا
          find android/ -name "build.gradle" -exec sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' {} +
          find android/ -name "build.gradle" -exec sed -i 's/targetSdkVersion.*/targetSdkVersion 36/g' {} +
          find android/ -name "build.gradle" -exec sed -i 's/minSdkVersion.*/minSdkVersion 21/g' {} +

          # build.gradle.kts فائل میں تمام جگہ compileSdk اور targetSdk 36 بنانا
          find android/ -name "build.gradle.kts" -exec sed -i 's/compileSdk =.*/compileSdk = 36/g' {} +
          find android/ -name "build.gradle.kts" -exec sed -i 's/targetSdk =.*/targetSdk = 36/g' {} +
          find android/ -name "build.gradle.kts" -exec sed -i 's/minSdk =.*/minSdk = 21/g' {} +
          find android/ -name "build.gradle.kts" -exec sed -i 's/minSdkVersion =.*/minSdkVersion = 21/g' {} +

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralStoreApp-APK
          path: build/app/outputs/flutter-apk/app-release.apk