name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java Development Kit
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Platform Files
        run: flutter create . --platforms=android

      - name: Fix minSdkVersion in build.gradle / build.gradle.kts
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion.*/minSdkVersion 21/g' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk =.*/minSdk = 21/g' android/app/build.gradle.kts
            sed -i 's/minSdkVersion =.*/minSdkVersion = 21/g' android/app/build.gradle.kts
          fi

      - name: Clean Project Cache
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      - name: Check Code Errors
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralStoreApp-APK
          path: build/app/outputs/flutter-apk/app-release.apk