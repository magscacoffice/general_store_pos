name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java Development Kit
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Android SDK 36 Platform
        run: |
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Create Android Platform Files & Camera Permissions
        run: |
          flutter create . --platforms=android
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "android.permission.CAMERA" "$MANIFEST_PATH"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="hardware.camera.any" android:required="false"/>' "$MANIFEST_PATH"
            fi
          fi

      - name: Clean and Fix build.gradle.kts Explicitly
        run: |
          # اگر build.gradle.kts موجود ہے تو اسے بالکل صاف کر کے صحیح SDK 36 اور minSdk 21 لکھنا
          GRADLE_KTS="android/app/build.gradle.kts"
          if [ -f "$GRADLE_KTS" ]; then
            echo "Cleaning and rewriting build.gradle.kts..."
            cat << 'EOF' > "$GRADLE_KTS"
            plugins {
                id("com.android.application")
                id("kotlin-android")
                id("dev.flutter.flutter-gradle-plugin")
            }

            android {
                namespace = "com.example.general_store_pos"
                compileSdk = 36
                ndkVersion = flutter.ndkVersion

                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_1_8
                    targetCompatibility = JavaVersion.VERSION_1_8
                }

                kotlinOptions {
                    jvmTarget = '1.8'
                }

                defaultConfig {
                    applicationId = "com.example.general_store_pos"
                    minSdk = 21
                    targetSdk = 36
                    versionCode = flutterVersionCode.toInt()
                    versionName = flutterVersionName
                }

                 buildTypes {
                    release {
                        signingConfig = signingConfigs.getByName("debug")
                    }
                }
            }

            flutter {
                source = "../.."
            }
            EOF
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralStoreApp-APK
          path: build/app/outputs/flutter-apk/app-release.apk