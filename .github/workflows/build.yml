name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java Development Kit
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Android SDK 36 Platform
        run: |
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Skip and Remove flutter_blue_plus from pubspec.yaml
        run: |
          if [ -f "pubspec.yaml" ]; then
            sed -i '/flutter_blue_plus/d' pubspec.yaml
          fi

      - name: Update Gradle SDK Versions to 36
        run: |
          GRADLE_KTS="android/app/build.gradle.kts"
          if [ -f "$GRADLE_KTS" ]; then
            sed -i 's/compileSdk =.*/compileSdk = 36/g' "$GRADLE_KTS"
            sed -i 's/targetSdk =.*/targetSdk = 36/g' "$GRADLE_KTS"
            sed -i 's/minSdk =.*/minSdk = 21/g' "$GRADLE_KTS"
          fi
          GRADLE_GROOVY="android/app/build.gradle"
          if [ -f "$GRADLE_GROOVY" ]; then
            sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' "$GRADLE_GROOVY"
            sed -i 's/targetSdkVersion.*/targetSdkVersion 36/g' "$GRADLE_GROOVY"
            sed -i 's/minSdkVersion.*/minSdkVersion 21/g' "$GRADLE_GROOVY"
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralStoreApp-APK
          path: build/app/outputs/flutter-apk/app-release.apk