name: Validate Native Windows Installer (Manual Only)

on:
  # Installer compilation and test-artifact upload are manual-only.
  # Regular WPF build/test validation remains in build-wpf.yml.
  workflow_dispatch:
    inputs:
      version:
        description: Installer version
        required: true
        default: "1.0.1.0"
        type: string

permissions:
  contents: read

jobs:
  validate-installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore, build and test WPF
        shell: pwsh
        run: |
          dotnet restore desktop-wpf/KhanBabaPos.Wpf.csproj
          dotnet build desktop-wpf/KhanBabaPos.Wpf.csproj -c Release --no-restore
          dotnet test desktop-wpf.Tests/KhanBabaPos.Wpf.Tests.csproj -c Release

      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: dotnet publish desktop-wpf/KhanBabaPos.Wpf.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish/win-x64

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile per-user installer (not published)
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          $version = $env:APP_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.0.1.0" }
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+) {
            throw "Invalid installer version: $version"
          }
          & $iscc "/DAppVersion=$version" "installer/KhanBabaPOS.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $installer = "artifacts/installer/KhanBabaPOS-Setup-x64.exe"
          if (-not (Test-Path $installer)) { throw "Installer output was not created." }
          Write-Host "Unsigned test installer compiled. This is not a production release."
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          Write-Host "Authenticode status: $($signature.Status). Production signing is a separate required gate."

      - name: Add test installer instructions
        shell: pwsh
        run: |
          @'
          KHAN BABA POS — WINDOWS INSTALLER TEST BUILD
          ============================================
          This is an unsigned TEST installer for owner acceptance only.
          Install only on a Windows 10/11 x64 test PC, preferably after taking a full backup.
          It installs per-user and does not require administrator privileges.
          Existing business database and backup folders are configured to survive uninstall.
          The installer does not migrate, replace, or delete the live SQLite database.
          Google Drive sync, updater installation, hardware and full feature parity are not production-accepted until separately verified.
          '@ | Set-Content artifacts/installer/TEST-INSTRUCTIONS.txt

      - name: Upload installable Windows test artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhanBabaPOS-Windows-Installer-Test
          path: |
            artifacts/installer/KhanBabaPOS-Setup-x64.exe
            artifacts/installer/TEST-INSTRUCTIONS.txt
          if-no-files-found: error
          retention-days: 30
) {
            throw "Invalid installer version: $version"
          }
          & $iscc "/DAppVersion=$version" "installer/KhanBabaPOS.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $installer = "artifacts/installer/KhanBabaPOS-Setup-x64.exe"
          if (-not (Test-Path $installer)) { throw "Installer output was not created." }
          Write-Host "Unsigned test installer compiled. This is not a production release."
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          Write-Host "Authenticode status: $($signature.Status). Production signing is a separate required gate."

      - name: Add test installer instructions
        shell: pwsh
        run: |
          @'
          KHAN BABA POS — WINDOWS INSTALLER TEST BUILD
          ============================================
          This is an unsigned TEST installer for owner acceptance only.
          Install only on a Windows 10/11 x64 test PC, preferably after taking a full backup.
          It installs per-user and does not require administrator privileges.
          Existing business database and backup folders are configured to survive uninstall.
          The installer does not migrate, replace, or delete the live SQLite database.
          Google Drive sync, updater installation, hardware and full feature parity are not production-accepted until separately verified.
          '@ | Set-Content artifacts/installer/TEST-INSTRUCTIONS.txt

      - name: Upload installable Windows test artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhanBabaPOS-Windows-Installer-Test
          path: |
            artifacts/installer/KhanBabaPOS-Setup-x64.exe
            artifacts/installer/TEST-INSTRUCTIONS.txt
          if-no-files-found: error
          retention-days: 30
