name: Publish Native WPF Candidate Build

on:
  push:
    branches:
      - integration/wpf-mainline
    paths:
      - '.github/workflows/publish-wpf-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-test-build:
    runs-on: windows-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore desktop-wpf/KhanBabaPos.Wpf.csproj

      - name: Build and test
        run: |
          dotnet build desktop-wpf/KhanBabaPos.Wpf.csproj --configuration Release --no-restore
          dotnet test desktop-wpf.Tests/KhanBabaPos.Wpf.Tests.csproj --configuration Release

      - name: Publish portable Windows x64 test app
        run: dotnet publish desktop-wpf/KhanBabaPos.Wpf.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --output artifacts/KhanBabaPOS-Windows-Candidate

      - name: Add test-build instructions
        shell: pwsh
        run: |
          @'
          KHAN BABA POS — NATIVE WINDOWS WPF CANDIDATE
          =========================================

          This is a PORTABLE WINDOWS CANDIDATE built from the WPF migration source after Release compilation and automated regression tests.
          It is not a signed production installer and has not passed all owner hardware/Drive acceptance gates.

          QUICK START
          1. Extract the complete ZIP to a normal writable folder (do not run from inside the ZIP).
          2. Run KhanBabaPos.Wpf.exe.
          3. Test first with a disposable copy of your SQLite v18 database.
          4. Keep your original store database and existing backups untouched.
          5. For Drive Sync, sign in as Admin and use Connect & Sync; Google consent opens in your default browser.
          6. WPF uses the current Windows Desktop OAuth Client ID and PKCE. No client secret is required; a fresh consent is expected for this client.

          IMPORTANT
          - Windows 10/11 x64 is required.
          - .NET 10 runtime is bundled; no separate .NET installation should be needed.
          - The app uses the existing local data path and must not be pointed at the live store database for first testing.
          - Real Google token refresh and Android-phone round-trip still require owner acceptance using disposable database copies.
          - SpeedX SP60D scanner, Black Copper BC-86AC physical printing, Windows DPI/layout, PDF and backup/restore also require target-PC acceptance.
          - Automatic installer download/install remains disabled until the production signing certificate and trusted thumbprint are configured.
          - Do not treat this candidate as a signed production installer.
          '@ | Set-Content artifacts/KhanBabaPOS-Windows-Candidate/CANDIDATE-INSTRUCTIONS.txt

      - name: Package portable test build
        run: Compress-Archive -Path artifacts/KhanBabaPOS-Windows-Candidate/* -DestinationPath artifacts/KhanBabaPOS-Windows-Candidate.zip -Force

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhanBabaPOS-Windows-Candidate-win-x64
          path: artifacts/KhanBabaPOS-Windows-Candidate.zip
          if-no-files-found: error
          retention-days: 30
