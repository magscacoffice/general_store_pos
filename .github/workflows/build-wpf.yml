name: Build Native WPF POS
on:
  push:
    paths: ['desktop-wpf/**', '.github/workflows/build-wpf.yml']
  pull_request:
    paths: ['desktop-wpf/**', '.github/workflows/build-wpf.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore desktop-wpf/KhanBabaPos.Wpf.csproj
      - run: dotnet build desktop-wpf/KhanBabaPos.Wpf.csproj --configuration Release --no-restore
      - run: dotnet publish desktop-wpf/KhanBabaPos.Wpf.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/khan-baba-pos-wpf-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: khan-baba-pos-wpf-win-x64
          path: artifacts/khan-baba-pos-wpf-win-x64/
          if-no-files-found: error
