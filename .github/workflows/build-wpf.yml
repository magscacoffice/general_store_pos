name: Build and Test Native WPF POS + Windows x64 Artifact

on:
  push:
    branches:
      - main
      - integration/wpf-mainline
      - feature/complete-project-pendings
    paths:
      - 'desktop-wpf/**'
      - 'desktop-wpf.Tests/**'
      - '.github/workflows/build-wpf.yml'
  workflow_dispatch:

concurrency:
  group: validate-wpf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore desktop-wpf/KhanBabaPos.Wpf.csproj
      - run: dotnet build desktop-wpf/KhanBabaPos.Wpf.csproj --configuration Release --no-restore
      - run: dotnet test desktop-wpf.Tests/KhanBabaPos.Wpf.Tests.csproj --configuration Release

      - name: Publish self-contained Windows x64 test app
        if: github.ref != 'refs/heads/feature/complete-project-pendings'
        shell: pwsh
        run: |
          dotnet publish desktop-wpf/KhanBabaPos.Wpf.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish/win-x64
          @'
          KHAN BABA POS — WINDOWS WPF TEST ARTIFACT
          =========================================
          This is an unsigned self-contained Windows x64 test build.
          Extract the ZIP and run KhanBabaPos.Wpf.exe on a Windows 10/11 x64 test PC.
          Use a disposable copy of the existing SQLite v18 database and take a separate backup first.
          This artifact is not a signed production release or a completed owner-acceptance build.
          Scanner, printer, Google Drive OAuth/sync, update flow and full feature parity require separate target-PC verification.
          '@ | Set-Content artifacts/publish/TEST-INSTRUCTIONS.txt
          Compress-Archive -Path artifacts/publish/win-x64/*,artifacts/publish/TEST-INSTRUCTIONS.txt -DestinationPath artifacts/KhanBabaPOS-Windows-x64.zip -Force

      - name: Upload Windows x64 test artifact
        if: github.ref != 'refs/heads/feature/complete-project-pendings'
        uses: actions/upload-artifact@v4
        with:
          name: KhanBabaPOS-Windows-x64-${{ github.run_number }}
          path: artifacts/KhanBabaPOS-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
