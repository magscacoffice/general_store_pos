name: Validate Native WPF POS (No Publish Artifacts)

on:
  push:
    paths: ['desktop-wpf/**', '.github/workflows/build-wpf.yml']
  pull_request:
    paths: ['desktop-wpf/**', '.github/workflows/build-wpf.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore desktop-wpf/KhanBabaPos.Wpf.csproj
      - run: dotnet build desktop-wpf/KhanBabaPos.Wpf.csproj --configuration Release --no-restore
