name: Validate and package native WPF POS (test release)

on:
  push:
    branches:
      - main
      - feature/complete-project-pendings
    paths:
      - 'desktop-wpf/**'
      - 'desktop-wpf.Tests/**'
      - '.github/workflows/build-wpf.yml'
  workflow_dispatch:

concurrency:
  group: validate-wpf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore, Release build and tests
        run: |
          dotnet restore desktop-wpf/KhanBabaPos.Wpf.csproj
          dotnet build desktop-wpf/KhanBabaPos.Wpf.csproj --configuration Release --no-restore
          dotnet test desktop-wpf.Tests/KhanBabaPos.Wpf.Tests.csproj --configuration Release
      - name: Publish unsigned self-contained Windows x64 test app
        shell: pwsh
        run: |
          dotnet publish desktop-wpf/KhanBabaPos.Wpf.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish/win-x64
          @'
          KHAN BABA POS — WINDOWS WPF TEST BUILD 1.0.1
          =============================================
          Unsigned test build for Windows 10/11 x64.
          Extract the ZIP and run KhanBabaPos.Wpf.exe.
          Take a full backup and test with a disposable database copy.
          Not a signed production release. Google Drive, scanner, printer,
          updater and full feature parity require separate owner acceptance.
          '@ | Set-Content artifacts/publish/TEST-INSTRUCTIONS.txt
          Compress-Archive -Path artifacts/publish/win-x64/*,artifacts/publish/TEST-INSTRUCTIONS.txt -DestinationPath artifacts/KhanBabaPOS-Windows-x64-v1.0.1-test.zip -Force
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile unsigned Windows installer test build
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DAppVersion=1.0.1.0" "installer/KhanBabaPOS.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $installer = "artifacts/installer/KhanBabaPOS-Setup-x64.exe"
          if (-not (Test-Path $installer)) { throw "Installer output was not created." }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          Write-Host "Unsigned test installer Authenticode status: $($signature.Status)"
          @'
          KHAN BABA POS — WINDOWS INSTALLER TEST BUILD
          ============================================
          Unsigned TEST installer for Windows 10/11 x64.
          Take a full backup before testing and use a disposable database copy.
          This is not a signed production release. Drive sync, hardware and full feature parity require owner acceptance.
          '@ | Set-Content artifacts/installer/TEST-INSTRUCTIONS.txt
      - name: Upload Windows test packages
        uses: actions/upload-artifact@v4
        with:
          name: KhanBabaPOS-Windows-v1.0.1-test
          path: |
            artifacts/KhanBabaPOS-Windows-x64-v1.0.1-test.zip
            artifacts/installer/KhanBabaPOS-Setup-x64.exe
            artifacts/installer/TEST-INSTRUCTIONS.txt
          if-no-files-found: error
          retention-days: 30
