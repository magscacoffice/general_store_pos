name: Validate Native WPF POS (Release Build + Tests)

on:
  push:
    branches:
      - main
      - integration/wpf-mainline
      - feature/complete-project-pendings
    paths:
      - 'desktop-wpf/**'
      - 'desktop-wpf.Tests/**'
      - '.github/workflows/build-wpf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore desktop-wpf/KhanBabaPos.Wpf.csproj
      - run: dotnet build desktop-wpf/KhanBabaPos.Wpf.csproj --configuration Release --no-restore
      - run: dotnet test desktop-wpf.Tests/KhanBabaPos.Wpf.Tests.csproj --configuration Release

# Owner-authorized validation on 2026-11-19.
# Validation only. No dotnet publish, ZIP creation, installer compilation,
# artifact upload, APK, or release publishing is performed by this workflow.
