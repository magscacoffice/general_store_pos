name: khan_baba_general_store
description: "A professional offline-first POS application with Windows-master Google Drive sync."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_messaging: ^15.2.10
  cloud_firestore: ^5.5.0
  file_picker: ^13.3.2
  http: ^1.4.0
  crypto: ^3.0.6
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.4+1
  sqflite_common_ffi: ^2.4.5
  path: ^1.9.1
  connectivity_plus: ^7.3.2
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1
  flutter_contacts: ^2.6.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.1
  print_bluetooth_thermal: ^1.0.6
  unified_esc_pos_printer: ^3.4.0
  network_info_plus: ^8.2.2
  share_plus: ^13.1.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  pdf: ^3.13.1
  printing: ^5.15.1
  desktop_multi_window: ^0.3.1
  window_manager: ^0.6.0

# window_manager 0.6.0 currently resolves nativeapi 0.5.10, whose
# runNativeApp helper uses Isolate.create, unavailable in stable Dart 3.13.
# Pin the compatible nativeapi pair until upstream publishes a stable fix.
dependency_overrides:
  nativeapi: 0.5.9
  nativeapi_flutter: 0.5.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true