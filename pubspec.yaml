name: khan_baba_general_store
description: "A professional offline-first POS application with Firebase Sync."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  file_picker: ^8.1.8
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.4+1
  path: ^1.9.1
  connectivity_plus: ^7.3.2
  google_sign_in: ^7.2.0
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  print_bluetooth_thermal: ^1.0.6
  share_plus: ^10.1.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true